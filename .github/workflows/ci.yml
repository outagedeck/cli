name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/outagedeck

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --build-arg VERSION=ci --tag outagedeck-cli:ci .
      - name: Check image
        run: |
          test "$(docker run --rm --network=none --read-only --cap-drop=ALL outagedeck-cli:ci version)" = "ci"
          docker run --rm --network=none --read-only --cap-drop=ALL outagedeck-cli:ci alerts github cloudflare | grep -F "stack=github%2Ccloudflare"
          test "$(docker image inspect outagedeck-cli:ci --format '{{.Config.User}}')" = "65532:65532"
