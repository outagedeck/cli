<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OutageDeck CLI checking four cloud and SaaS providers</title>
  <desc id="desc">A terminal shows live status for GitHub, Anthropic, Cloudflare, and OpenAI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1a"/>
      <stop offset="0.55" stop-color="#111a32"/>
      <stop offset="1" stop-color="#17244a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="240" fill="#7c3aed" opacity="0.09"/>
  <circle cx="120" cy="630" r="260" fill="#22d3ee" opacity="0.06"/>

  <g transform="translate(60 37)">
    <rect width="39" height="39" rx="10" fill="url(#brand)"/>
    <path d="M9 20h5l3-8 5 17 4-11 3 5h3" fill="none" stroke="#07111f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750" letter-spacing="1.4">OUTAGEDECK</text>
    <text x="310" y="28" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Is it us, or is it them?</text>
  </g>

  <g transform="translate(60 100)" filter="url(#shadow)">
    <rect width="1080" height="490" rx="18" fill="#080c16" stroke="#26324d" stroke-width="2"/>
    <path d="M18 0h1044a18 18 0 0 1 18 18v38H0V18A18 18 0 0 1 18 0Z" fill="#151c2c"/>
    <circle cx="28" cy="28" r="7" fill="#fb7185"/>
    <circle cx="52" cy="28" r="7" fill="#fbbf24"/>
    <circle cx="76" cy="28" r="7" fill="#34d399"/>
    <text x="540" y="35" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">outagedeck — status</text>

    <g font-family="Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
      <text x="34" y="103" fill="#67e8f9" font-size="17" font-weight="700">$</text>
      <text x="56" y="103" fill="#e2e8f0" font-size="17">outagedeck status --fail-on=never github anthropic cloudflare openai</text>

      <rect x="34" y="137" width="38" height="27" rx="6" fill="#064e3b"/>
      <text x="53" y="156" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">OK</text>
      <text x="88" y="158" fill="#f8fafc" font-size="20" font-weight="700">GitHub</text>
      <text x="176" y="158" fill="#94a3b8" font-size="20">Operational — All Systems Operational</text>

      <rect x="34" y="194" width="38" height="27" rx="6" fill="#064e3b"/>
      <text x="53" y="213" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">OK</text>
      <text x="88" y="215" fill="#f8fafc" font-size="20" font-weight="700">Anthropic</text>
      <text x="218" y="215" fill="#94a3b8" font-size="20">Operational — All Systems Operational</text>

      <rect x="34" y="251" width="38" height="27" rx="6" fill="#78350f"/>
      <text x="53" y="270" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">!!</text>
      <text x="88" y="272" fill="#f8fafc" font-size="20" font-weight="700">Cloudflare</text>
      <text x="218" y="272" fill="#fbbf24" font-size="20">Degraded — Minor Service Outage</text>

      <rect x="34" y="308" width="38" height="27" rx="6" fill="#78350f"/>
      <text x="53" y="327" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">!!</text>
      <text x="88" y="329" fill="#f8fafc" font-size="20" font-weight="700">OpenAI</text>
      <text x="176" y="329" fill="#fbbf24" font-size="20">Degraded — Partial System Degradation</text>
    </g>

    <line x1="34" y1="380" x2="1046" y2="380" stroke="#26324d"/>
    <text x="34" y="420" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">172 providers</text>
    <circle cx="181" cy="414" r="3" fill="#475569"/>
    <text x="197" y="420" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">official vendor feeds</text>
    <circle cx="395" cy="414" r="3" fill="#475569"/>
    <text x="411" y="420" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">JSON output</text>
    <circle cx="543" cy="414" r="3" fill="#475569"/>
    <text x="559" y="420" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">CI exit thresholds</text>
    <text x="1046" y="420" text-anchor="end" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">macOS · Linux · Windows</text>
  </g>

  <text x="600" y="638" text-anchor="middle" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">brew install outagedeck/tap/outagedeck</text>
</svg>
